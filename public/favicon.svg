<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AM">
  <style>
    .tile { fill: #141413 }
    .mark { fill: #f1f0ec }
    .accent { stroke: #ff7055 }
    /* invert the tile against dark browser chrome so the mark keeps contrast */
    @media (prefers-color-scheme: dark) {
      .tile { fill: #f1f0ec }
      .mark { fill: #141413 }
    }
  </style>

  <rect class="tile" width="64" height="64" rx="15" />

  <!-- hand-drawn underline, echoing the sketch connectors in the career section -->
  <path
    class="accent"
    d="M12.2 46.6c8.3 2.5 16.7 3.3 25.1 2.5 4.9-.5 9.7-1.7 14.5-3.6"
    fill="none"
    stroke-width="4.6"
    stroke-linecap="round"
  />

  <text
    class="mark"
    x="32"
    y="37"
    text-anchor="middle"
    font-family="Philosopher, Georgia, 'Times New Roman', serif"
    font-size="31"
    font-weight="700"
  >AM</text>
</svg>
