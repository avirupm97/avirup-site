<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#141413" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Avirup Mukherjee — Founding PM at Kombai. I turn ambitious ideas into products people can actually use."
    />
    <title>Avirup Mukherjee — Founding PM, Kombai</title>
    <link rel="canonical" href="https://avirupmukherjee.cc/" />

    <!-- Open Graph. Crawlers never resolve relative paths, so every URL here is absolute. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Avirup Mukherjee" />
    <meta property="og:url" content="https://avirupmukherjee.cc/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Avirup Mukherjee — Founding PM, Kombai" />
    <meta
      property="og:description"
      content="Founding PM at Kombai, working across AI agents, growth and platform. I turn ambitious ideas into products people can actually use."
    />
    <!-- JPEG over PNG: keeps the card near 120 kB so WhatsApp's ~300 kB preview
         fetch limit is never the reason a link renders without an image. -->
    <meta property="og:image" content="https://avirupmukherjee.cc/og-image.jpg" />
    <meta
      property="og:image:secure_url"
      content="https://avirupmukherjee.cc/og-image.jpg"
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Avirup Mukherjee — Founding PM, Kombai. AI agents, Growth, Platform."
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@avirupm97" />
    <meta name="twitter:creator" content="@avirupm97" />
    <meta name="twitter:title" content="Avirup Mukherjee — Founding PM, Kombai" />
    <meta
      name="twitter:description"
      content="Founding PM at Kombai, working across AI agents, growth and platform. I turn ambitious ideas into products people can actually use."
    />
    <meta name="twitter:image" content="https://avirupmukherjee.cc/og-image.jpg" />
    <meta
      name="twitter:image:alt"
      content="Avirup Mukherjee — Founding PM, Kombai. AI agents, Growth, Platform."
    />
    <link
      rel="preload"
      as="image"
      href="/portrait-600.webp"
      type="image/webp"
      imagesrcset="/portrait-400.webp 400w, /portrait-600.webp 600w, /portrait-858.webp 858w"
      imagesizes="380px"
      media="(min-width: 1024px)"
      fetchpriority="high"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Philosopher:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@400;500;600&family=Dancing+Script:wght@600;700&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Philosopher:ital,wght@0,400;0,700;1,400;1,700&family=Inter:wght@400;500;600&family=Dancing+Script:wght@600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
